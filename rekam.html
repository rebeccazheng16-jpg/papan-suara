<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F2EA">
<title>Rekam Naskah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
/* 配色只用：米白 / 纯白 / 深红 / 正红 / 黑 / 深灰（11-05 她定，粉调全去掉） */
:root{
  --bg:#F6F2EA; --card:#FFFFFF; --ink:#111111; --mute:#4A4A4A; --line:#DED7C9; --soft:#EEE8DC;
  --red:#D7263D; --dark:#8E1B26; --on:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#121212; --card:#1C1A17; --ink:#F3EFE7; --mute:#B9B3A8; --line:#3A362F; --soft:#262320; --red:#E23B50; --dark:#A5202F; --on:#FFFFFF; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
.solid:disabled,.big:disabled,.modal .ok:disabled{background:var(--line);color:var(--mute)}   /* 禁用态用灰，不用半透明红（会发粉） */
/* 每一屏＝固定满屏三段：顶栏 / 中间 / 底部按钮，不整页滚动 */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;min-height:48px;flex:none}
.topbar .back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:16px;min-height:44px;padding-inline:4px 10px;margin-left:-4px}
.topbar .back svg{width:22px;height:22px}
.topbar .ttl{flex:1;min-width:0;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:block;font-family:"Noto Sans",sans-serif;font-weight:400;font-size:12px;color:var(--mute);letter-spacing:0}
.lang{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex:none}
.lang button{border:0;background:transparent;border-radius:9px;min-width:42px;min-height:38px;font-size:13px;font-weight:600;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:6px}
.mid.center{justify-content:center}
.foot{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.scroll{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
/* 吉祥物 Momo ＋ 气泡 */
.cici{display:flex;align-items:flex-end;gap:10px;flex:none}
.cici img{width:64px;height:64px;flex:none;object-fit:contain}
.cici.lg img{width:104px;height:104px}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.45;color:var(--ink);flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--red)}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lab{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.inp{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding-inline:14px;font-size:17px}
.inp:focus{outline:none;border-color:var(--ink)}
.ta{padding-block:12px;line-height:1.5;resize:none;min-height:0;flex:1}
.ta.sm{flex:none;min-height:90px;font-size:15px}
.err{color:var(--red);font-size:14px;margin:0;font-weight:600;line-height:1.4}
.tip{color:var(--mute);font-size:14px;line-height:1.5;margin:0}
.big{width:100%;min-height:60px;border:0;border-radius:16px;background:var(--red);color:var(--on);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;letter-spacing:.03em;padding-inline:12px}
.big.dark{background:var(--dark)}
.big.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink);font-size:19px}
.big small{display:block;font-family:"Noto Sans",sans-serif;font-weight:400;font-size:12px;letter-spacing:0;opacity:.9;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{align-self:center;border:0;background:transparent;color:var(--mute);font-size:14px;min-height:40px;padding-inline:12px;text-decoration:underline}
/* 脚本列表 */
.slist{display:flex;flex-direction:column;gap:10px}
.sitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.sitem .num{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;color:var(--red);flex:none;min-width:34px}
.sitem .t{flex:1;min-width:0}
.sitem .t b{display:block;font-size:16px;line-height:1.3}
.sitem .t span{display:block;font-size:13px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .go{flex:none;background:var(--red);color:var(--on);border-radius:10px;font-weight:700;font-size:14px;padding:8px 12px}
.sitem .go.done{background:var(--soft);color:var(--mute)}
/* 总览（开拍前） */
.ov{display:flex;flex-direction:column;gap:10px}
.ov .seg{border-top:1px solid var(--line);padding-top:8px;display:grid;grid-template-columns:30px 1fr;gap:8px}
.ov .seg b{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:800;color:var(--red)}
.ov .seg .s{font-size:12px;color:var(--mute)}
.ov .seg .d{font-size:14px;color:var(--mute);line-height:1.45;margin-top:2px}
.ov .seg .l{font-size:15px;font-weight:600;line-height:1.45;margin-top:4px}
.ov .all{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55;font-weight:600}
/* 分镜屏 */
.prog{display:flex;gap:4px;flex:none}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.ok{background:var(--dark)}
.prog i.cur{background:var(--red)}
.shot{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto;-webkit-overflow-scrolling:touch}
.shot .head{display:flex;align-items:baseline;gap:10px}
.shot .head .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:30px;line-height:1}
.shot .head .s{font-size:14px;color:var(--mute)}
.face{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.45}
.face b,.do b,.lines-lab{display:block;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.do{font-size:15px;line-height:1.5;color:var(--mute)}
.do p{margin:0;color:var(--ink)}
.lines-row{display:flex;align-items:flex-start;gap:8px}
.lines{flex:1;font-size:20px;line-height:1.45;font-weight:600;border-left:4px solid var(--red);padding-left:12px}
.lines.none{color:var(--mute);font-weight:400;font-size:16px;border-color:var(--line)}
.lines.edited{border-color:var(--dark)}
.pen{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
.pvwrap{position:relative;aspect-ratio:9/16;max-height:40vh;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;width:auto}
.pvwrap video{width:100%;height:100%;object-fit:cover;display:block}
.pvwrap .zoom{position:absolute;right:8px;top:8px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;min-width:40px;min-height:40px;font-size:18px}
.pickbtn{position:relative;overflow:hidden}
.pickbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
/* 总览（录完） */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:10px;min-height:50px;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.list .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;width:1.6em;color:var(--mute)}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .st{font-size:13px;font-weight:600;color:var(--mute);flex:none;display:inline-flex;align-items:center;gap:6px}
.list .st.ok{color:var(--dark)}
.list .st.bad{color:var(--red)}
.list button{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding-inline:10px;font-size:13px;font-weight:600;flex:none}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
.modal .box{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .q{font-size:18px;font-weight:600;line-height:1.4;margin:0}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal button{min-height:48px;border-radius:12px;font-weight:600;font-size:16px}
.modal .ok{border:0;background:var(--red);color:var(--on)}
.modal .no{border:1.5px solid var(--line);background:transparent;color:var(--ink)}
/* 录制全屏 */
.rec{position:fixed;inset:0;background:#000;color:#fff;z-index:20;display:flex;flex-direction:column}
.rec video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rec video.mirror{transform:scaleX(-1)}
.rec .rtop{position:relative;display:flex;align-items:center;gap:8px;margin:calc(6px + env(safe-area-inset-top,0px)) 12px 0}
.rec .rback{display:inline-flex;align-items:center;gap:4px;border:0;background:rgba(0,0,0,.5);color:#fff;border-radius:12px;min-height:44px;padding-inline:10px 14px;font-weight:600}
.rec .rback svg{width:20px;height:20px}
.rec .tgl{border:0;background:rgba(0,0,0,.5);color:#fff;border-radius:12px;min-height:44px;padding-inline:12px;font-weight:600;font-size:14px}
.rec .tgl[aria-pressed="true"]{background:#fff;color:#000}
.timer{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.5);border-radius:10px;padding-inline:10px;min-height:40px;display:flex;align-items:center;gap:8px}
.timer i{width:12px;height:12px;border-radius:50%;background:#E23B2E;display:inline-block;animation:bl 1s steps(2) infinite}
@keyframes bl{to{opacity:.2}}
.prompt{position:relative;margin:8px 12px 0;height:36vh;overflow:hidden;border-radius:14px;background:rgba(0,0,0,.55);
  -webkit-mask-image:linear-gradient(transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 12%,#000 88%,transparent 100%)}
.prompt[hidden]{display:none}
.prompt .txt{position:absolute;left:16px;right:16px;top:12px;font-size:30px;line-height:1.4;font-weight:600;will-change:transform;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.prompt .paused{position:absolute;inset:0;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:40px;background:rgba(0,0,0,.35)}
.silent{margin:8px 12px 0;border-radius:14px;background:rgba(0,0,0,.6);padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.silent img{width:48px;height:48px;flex:none;object-fit:contain}
.silent .big1{font-size:19px;font-weight:700;line-height:1.35}
.silent .big2{font-size:16px;line-height:1.45;margin-top:6px;opacity:.95}
.spd{position:relative;margin:8px 12px 0;display:flex;gap:6px;justify-content:flex-end}
.spd[hidden]{display:none}
.spd button{min-width:56px;min-height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:14px}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:46vw;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.hint{position:absolute;left:12px;right:12px;bottom:calc(136px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.4;max-height:28vh;overflow:auto}
.framing,.autostop{position:absolute;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.shutter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0}
.shutter span{display:block;width:62px;height:62px;border-radius:50%;background:#E23B2E;margin:0 auto}
.stop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:#E23B2E;color:#fff;font-weight:800;font-size:18px}
.flipcam{position:absolute;left:16px;bottom:calc(44px + env(safe-area-inset-bottom,0px));border:0;background:rgba(0,0,0,.5);color:#fff;border-radius:10px;min-height:44px;padding-inline:14px;font-weight:600}
@media (prefers-reduced-motion: reduce){.prompt .txt{transition:none}.timer i{animation:none}}
</style>
</head>

function confirmBox(q, okLabel, noLabel) {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="box"><p class="q"></p><div class="row"><button class="no"></button><button class="ok"></button></div></div>`;
    $(".q", m).textContent = q; $(".ok", m).textContent = okLabel; $(".no", m).textContent = noLabel;
    const done = v => { m.remove(); res(v); };
    $(".ok", m).onclick = () => done(true); $(".no", m).onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    document.body.appendChild(m); $(".no", m).focus();
  });
}

const DB = { name: "rekam", store: "takes" };
function dbOpen() {
  return new Promise((res, rej) => { if (!window.indexedDB) return rej(0); const r = indexedDB.open(DB.name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB.store); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function dbPut(i, v) { try { const d = await dbOpen(); const tx = d.transaction(DB.store, "readwrite"); tx.objectStore(DB.store).put(v, `${sid}:${i}`); await new Promise(r => tx.oncomplete = r); } catch (e) {} }
async function dbDel(i) { try { const d = await dbOpen(); const tx = d.transaction(DB.store, "readwrite"); tx.objectStore(DB.store).delete(`${sid}:${i}`); await new Promise(r => tx.oncomplete = r); } catch (e) {} }
async function dbLoad() {
  takes.length = 0;
  try { const d = await dbOpen(); const st = d.transaction(DB.store).objectStore(DB.store);
    const keys = await new Promise(r => { const q = st.getAllKeys(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); });
    for (const k of keys) { if (!String(k).startsWith(sid + ":")) continue; const i = +String(k).split(":")[1];
      const v = await new Promise(r => { const q = st.get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); });
      if (v?.blob) takes[i] = { blob: v.blob, url: URL.createObjectURL(v.blob), raw: v.raw || v.blob, rot: v.rot, landscape: v.landscape, up: v.up === "done" ? "done" : "", msg: "" }; }
  } catch (e) {}
}
const persist = i => { const tk = takes[i]; if (tk?.blob) dbPut(i, { blob: tk.blob, raw: tk.raw, rot: tk.rot, landscape: tk.landscape, up: tk.up }); else dbDel(i); };

// ===== 导航：每进一屏 pushState，手机的返回键和左上角 ← 都走 goBack =====
function go(v, push = true) { view = v; if (push) history.pushState({ v, cur, sid }, ""); render(); }
function goBack() {
  if (view === "shot") { if (editing) { editing = false; render(); return; } if (cur > 0) { cur--; store.set("cur_" + sid, cur); render(); } else go(script?.prep ? "prep" : "preview", false); }
  else if (view === "overview") { cur = script.shots.length - 1; store.set("cur_" + sid, cur); view = "shot"; render(); }
  else if (view === "prep") { go("preview", false); }
  else if (view === "preview") { go("scripts", false); }
  else if (view === "mine") { if (mineDraft) { mineDraft = null; render(); } else go("scripts", false); }
  else render();
}
window.addEventListener("popstate", () => { if (view === "login" || view === "scripts") { render(); return; } goBack(); });
history.replaceState({ v: view }, "");

function ping() {
  if (!UPLOAD_URL || !name || view === "login") return;
  const key = `${view}:${sid}:${cur}`; const now = Date.now();
  if (key === seenKey && now - seenAt < 20000) return;
  seenKey = key; seenAt = now;
  try { fetch(UPLOAD_URL, { method: "POST", body: JSON.stringify({ action: "seen", who: name, handle: profile?.handle || "", nick: profile?.name || "", link: profile?.link || "",
    script: script?.id || "", shot: view === "shot" && script ? script.shots[cur]?.n : (view === "overview" ? "总览" : ""), view, lang, ua: navigator.userAgent }), keepalive: true }); } catch (e) {}
}

    prompt.onclick = () => { if (!rec) return; paused = !paused; if (paused) { pausedAt = performance.now(); prompt.insertAdjacentHTML("beforeend", `<div class="paused" id="pz">${t("tapPause")}</div>`); } else { t0 += performance.now() - pausedAt; $("#pz", ov)?.remove(); } }; }

}

// ===== 存文件：原样复制画面和声音，补竖屏标记、写文件名进标题 =====
let MB = null;
async function mb() { if (!MB) MB = await import(MB_URL); return MB; }
async function normalize(blob, title, forceRot) {
  const M = await mb();

  const at = await input.getPrimaryAudioTrack();

  const output = new M.Output({ format: new M.Mp4OutputFormat({ fastStart: "in-memory" }), target: new M.BufferTarget() });
  const vs = new M.EncodedVideoPacketSource(await vt.getCodec()); output.addVideoTrack(vs, { rotation: fix });
  let as = null; if (at) { as = new M.EncodedAudioPacketSource(await at.getCodec()); output.addAudioTrack(as); }
  output.setMetadataTags({ title });
  await output.start();

  for await (const p of new M.EncodedPacketSink(vt).packets()) { await vs.add(p, first ? { decoderConfig: await vt.getDecoderConfig() } : undefined); first = false; }
  if (as) { first = true; for await (const p of new M.EncodedPacketSink(at).packets()) { await as.add(p, first ? { decoderConfig: await at.getDecoderConfig() } : undefined); first = false; } }
  await output.finalize();

}

  catch (e) { takes[i] = { blob, url: URL.createObjectURL(blob), raw: blob, up: "", msg: "" }; }
  persist(i); render();   // 录完只存在手机里，不自动上传：她先去美颜，传不传、传哪版由她在总览决定
}
async function rotateTake(i) {

  try { const r = await normalize(tk.raw, fileName(i).replace(/\.mp4$/, ""), next); takes[i] = { blob: r.blob, url: URL.createObjectURL(r.blob), landscape: true, rot: next, raw: tk.raw, up: "", msg: "" }; }
  catch (e) { takes[i] = tk; }

}

  try {
    if (mobile && navigator.canShare && navigator.canShare({ files })) await navigator.share({ files });
    else for (const f of files) { const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 300)); }
    saveMsg = (files.length > 1 ? t("concatFail") + " " : "") + t("savedOk");
  } catch (e) {}
  render();
}

// ===== 上传：Drive 续传会话，6MB 一块。进度写在手机本地，来电/切 App/刷新回来从断点接着传 =====
// 一个上传任务 = { key, session, offset, total, name, kind, shot, i, status }；队列存 upq_<sid>
const queueKey = () => "upq_" + sid;
const loadQueue = () => store.get(queueKey(), []);
const saveQueue = q => store.set(queueKey(), q);
function saveJob(job) { const q = loadQueue(); const k = q.findIndex(x => x.key === job.key); if (k >= 0) q[k] = job; else q.push(job); saveQueue(q); }
function dropJob(key) { saveQueue(loadQueue().filter(x => x.key !== key)); }
let pumping = false;
async function beginSession(meta) {
  const r = await post(Object.assign({ action: "begin", who: name, handle: profile.handle, link: profile.link, nick: profile.name, script: script.id, lang }, meta));
  if (!r.ok) throw new Error(r.error || "begin");
  return r;
}
const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
// 把一个 blob 从 job.offset 传到底；每块成功后把 offset 存回队列
async function pumpOne(job, blob, onPct, depth = 0) {
  if (depth > 2) throw new Error("session");
  if (!job.session) { const r = await beginSession({ filename: job.name, size: blob.size, mime: "video/mp4", shot: job.shot, kind: job.kind }); job.session = r.session; job.offset = 0; job.total = blob.size; saveJob(job); }
  else { try { const st = await post({ action: "status", session: job.session }); if (st.ok) { if (st.done) return true; job.offset = st.received || 0; } else if (/expired|no session/.test(st.error || "")) { job.session = ""; saveJob(job); return pumpOne(job, blob, onPct, depth + 1); } } catch (e) {} }
  while (job.offset < blob.size) {
    const end = Math.min(blob.size, job.offset + CHUNK);
    const data = await b64(blob.slice(job.offset, end));
    const r = await post({ action: "chunk", session: job.session, offset: job.offset, total: blob.size, data });
    if (!r.ok) { if (/expired|no session/.test(r.error || "")) { job.session = ""; saveJob(job); return pumpOne(job, blob, onPct, depth + 1); } throw new Error(r.error || "chunk"); }
    job.offset = r.done ? blob.size : (r.received ?? end); saveJob(job); onPct(Math.round(job.offset / blob.size * 100));
    if (r.done) return true;
  }
  return true;
}
async function pump() {
  if (pumping) return; pumping = true;
  let lock = null; try { lock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  for (;;) {
    const job = loadQueue().find(x => x.status !== "done" && !(x.kind === "final" && x.status === "wait" && !(finalFile && `${finalFile.name}:${finalFile.size}` === x.key)));
    if (!job) break;
    if (job.kind === "final") {
      finalState = { name: job.name, pct: Math.round((job.offset || 0) / finalFile.size * 100), status: "busy" }; store.set("final_" + sid, finalState); render();
      try { await pumpOne(job, finalFile, p => { finalState.pct = p; store.set("final_" + sid, finalState); render(); }); finalState = { name: job.name, pct: 100, status: "done" }; store.set("final_" + sid, finalState); dropJob(job.key); }
      catch (e) { finalState.status = "fail"; store.set("final_" + sid, finalState); job.status = "wait"; saveJob(job); render(); break; }
    } else {
      const tk = takes[job.i]; if (!tk?.blob) { dropJob(job.key); continue; }
      tk.up = "busy"; tk.pct = Math.round((job.offset || 0) / tk.blob.size * 100); render();
      try { await pumpOne(job, tk.blob, p => { tk.pct = p; render(); }); tk.up = "done"; tk.pct = 100; persist(job.i); dropJob(job.key); }
      catch (e) { tk.up = "fail"; persist(job.i); job.status = "wait"; saveJob(job); render(); break; }
    }
    render();
  }
  pumping = false; try { lock?.release(); } catch (e) {}
  render();
}
function uploadRaw(idx) {
  if (!UPLOAD_URL) return;
  idx.forEach(i => { const key = `seg:${sid}:${script.shots[i].n}`; if (!loadQueue().some(x => x.key === key)) saveJob({ key, session: "", offset: 0, total: takes[i].blob.size, name: fileName(i), kind: "seg", shot: script.shots[i].n, i, status: "wait" }); takes[i].up = "busy"; takes[i].pct = 0; });
  render(); pump();
}
function uploadFinal(file) {
  finalFile = file;
  const key = `${file.name}:${file.size}`;
  const old = loadQueue().find(x => x.kind === "final");
  if (old && old.key !== key) dropJob(old.key);   // 换了个文件就重新开始
  if (!loadQueue().some(x => x.key === key)) saveJob({ key, session: "", offset: 0, total: file.size, name: finalName(), kind: "final", shot: "final", status: "wait" });
  finalState = { name: finalName(), pct: 0, status: "busy" }; store.set("final_" + sid, finalState);
  render(); pump();
}
// 回到页面 / 打开脚本时：队列里有没传完的原片就接着传；成片要她再选一次同一个文件（文件对象没法留在页面里）
function resumeUploads() {
  const q = loadQueue(); if (!q.length) return;
  let any = false;
  q.forEach(j => { if (j.kind === "seg" && takes[j.i]?.blob && takes[j.i].up !== "done") { takes[j.i].up = "busy"; any = true; } });
  if (finalState && finalState.status === "busy" && !finalFile) { finalState.status = "wait"; store.set("final_" + sid, finalState); }
  if (any) pump(); else render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && script && (view === "overview")) resumeUploads(); });
window.__rekam = { takes, finishTake, normalize, fileName, get script() { return script; } };

// ===== 启动 =====
if (profile && sid) await openScript(sid); else render();
</script>
</body>
