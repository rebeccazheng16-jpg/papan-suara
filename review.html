<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>达人自录 审片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* 配色只用：米白 / 纯白 / 深红 / 正红 / 黑 / 深灰（11-05 她定，粉调全去掉） */
:root{
  --bg:#FFFFFF; --panel:#F6F2EA; --panel2:#EEE8DC; --ink:#111111; --mute:#4A4A4A; --line:#DED7C9;
  --red:#D7263D; --dark:#8E1B26; --on:#FFFFFF; --ok:#1F1F1F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#121212; --panel:#1C1A17; --panel2:#262320; --ink:#F3EFE7; --mute:#B9B3A8; --line:#3A362F; --red:#E23B50; --dark:#A5202F; --on:#FFFFFF; --ok:#F3EFE7; }
}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,sans-serif;font-size:14px;padding-inline:16px;padding-block:12px 40px;box-sizing:border-box}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;letter-spacing:.02em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1 small{font-family:"Noto Sans",sans-serif;font-weight:400;font-size:13px;color:var(--mute)}
h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;white-space:nowrap}
h2 small{font-family:"Noto Sans",sans-serif;font-weight:400;font-size:12px;color:var(--mute)}
button,input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
.solid:disabled,.big:disabled,.modal .ok:disabled{background:var(--line);color:var(--mute)}   /* 禁用态用灰，不用半透明红（会发粉） */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.in{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding-inline:12px;box-sizing:border-box}
.solid{border:0;border-radius:10px;background:var(--red);color:var(--on);font-weight:600;min-height:38px;padding-inline:14px}
.solid.dark{background:var(--dark)}
.ghost{border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:38px;padding-inline:14px;color:var(--ink)}
.ghost.sm,.solid.sm{min-height:30px;padding-inline:10px;font-size:12px;border-radius:8px}
.tip{color:var(--mute);font-size:13px;margin:0;line-height:1.5}
.err{color:var(--red);font-size:13px;margin:0;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
/* 脚本库索引（抄金榜：产品 chip + 搜索 + 一行一本） */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;background:var(--bg);min-height:28px;padding-inline:10px;font-size:12px;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slist{display:flex;flex-direction:column;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.srow{display:grid;grid-template-columns:64px minmax(90px,.8fr) minmax(0,1.6fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.srow:first-child{border-top:0}
.srow:hover{background:var(--panel)}
.srow.on{background:var(--panel2)}
.srow .no{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:17px}
.srow .prod{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .hook{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{color:var(--mute);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .own{font-size:11px;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:1px 5px;margin-left:6px}
.sdetail{padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px;font-size:13px}
.sdetail .prep{color:var(--mute);line-height:1.5}
.shotline{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:start;line-height:1.5}
.shotline b{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:800}
.shotline .do{color:var(--mute)}
.shotline .ln{font-weight:600}
.shotline .ln.none{font-weight:400;color:var(--mute)}
/* 达人卡 */
.talent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.talent header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.talent header b{font-size:17px}
.talent header a{color:var(--mute);font-size:13px}
.talent header .del{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mute);min-height:28px;padding-inline:10px;font-size:12px}
.seen{font-size:13px;color:var(--mute)}
.seen.on{color:var(--dark);font-weight:600}
.assigned{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.assigned .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 6px 3px 9px}
.assigned .tag b{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:800}
.assigned .tag span{color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assigned .tag button{border:0;background:transparent;color:var(--mute);font-size:14px;line-height:1;padding:2px 4px}
.assigned .tag button:hover{color:var(--red)}
.script{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.script .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.script .h b{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:800}
.miss{color:var(--red);font-size:13px;font-weight:600}
.full{color:var(--ok);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shot{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;cursor:pointer}
.shot:hover{border-color:var(--red)}
.shot .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--panel2);color:var(--mute);font-size:14px;line-height:1;padding:0}
.shot .x:hover{background:var(--red);color:#fff}
.shot b{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:800}
.shot .m{color:var(--mute);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.shot.dup b::after{content:" ×2";color:var(--dark);font-size:13px}
.shot .ed{color:var(--dark);font-size:12px;font-weight:600;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
/* 成片：达人美颜后传的整条，深红边框单独一块放在分段前面 */
.finals{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.shot.final{border:2px solid var(--dark)}
.shot.final b{color:var(--dark)}
/* 自己拆脚本额度 */
.quota{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.quota b{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.quota input{width:64px;min-height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-inline:8px;font-size:13px;font-variant-numeric:tabular-nums;box-sizing:border-box}
/* 达人意见 */
.notes{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.notes .nh{font-weight:600}
.note{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:baseline}
.note .t{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.note .s{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:15px;white-space:nowrap}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.notes .more{align-self:flex-start}
.note.sys .txt{color:var(--mute);font-size:12px}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px;box-sizing:border-box}
.modal .box{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:92vh;overflow:auto;box-sizing:border-box}
.modal .box.wide{max-width:860px}
.modal .q{font-size:17px;font-weight:600;line-height:1.4;margin:0}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .row button{min-height:44px;border-radius:12px;font-weight:600;font-size:15px}
.modal .ok{border:0;background:var(--red);color:var(--on)}
.modal .no{border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.lab{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
textarea.in{min-height:160px;padding:10px 12px;line-height:1.5;resize:vertical;width:100%}
.who-list{display:flex;gap:6px;flex-wrap:wrap}
.edit{display:grid;grid-template-columns:40px 56px 1fr 1fr;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.edit:first-child{border-top:0;padding-top:0}
.edit b{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:800;padding-top:6px}
.edit input,.edit textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 8px;font-size:13px;line-height:1.4}
.edit textarea{min-height:58px;resize:vertical}
.edit .cell{display:flex;flex-direction:column;gap:4px}
.edit .cell small{color:var(--mute);font-size:11px}
.edit .lines{grid-column:3 / span 2}
.player{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;padding:16px;box-sizing:border-box}
.player iframe{width:min(100%,420px);aspect-ratio:9/16;max-height:80vh;border:0;border-radius:12px;background:#000}
.player .pt{color:#fff;font-size:14px;text-align:center;overflow-wrap:anywhere}
.player button{min-height:40px;border:0;border-radius:10px;background:#fff;color:#000;padding-inline:16px;font-weight:600}
.player a{color:#fff}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script type="module">
const API = "https://script.google.com/macros/s/AKfycbwkzJKhqvJkTh-jHsVNhYcfKnJ2raDLCS2GIkJ7i96mvZ7UKM3-SApkFBCob25VZFNV/exec";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let key = store.get("review_key", "");
// 钥匙走 # 片段（review.html#key=…）：片段不出浏览器、不进 GitHub Pages 日志；旧的 ?key= 还认，读到就抹掉
const qk = new URLSearchParams(location.hash.slice(1)).get("key") || new URLSearchParams(location.search).get("key");
if (qk) { key = qk; store.set("review_key", key); history.replaceState(null, "", location.pathname); }
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
const okUrl = u => /^https:\/\/(www\.)?(tiktok\.com|instagram\.com)\/[\w.@%\/?=&-]*$/i.test(String(u || "")) ? String(u) : "";   // 达人填的链接只认 TikTok / IG，别的不进 href

// ===== 弹窗 =====
function confirmBox(q, okLabel, noLabel) {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="box"><p class="q"></p><div class="row"><button class="no"></button><button class="ok"></button></div></div>`;
    $(".q", m).textContent = q; $(".ok", m).textContent = okLabel; $(".no", m).textContent = noLabel;
    const done = v => { m.remove(); res(v); };
    $(".ok", m).onclick = () => done(true); $(".no", m).onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    document.body.appendChild(m); $(".no", m).focus();
  });
}
function modal(html, wide) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box ${wide ? "wide" : ""}">${html}</div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m); return m;
}

// ===== 数据 =====
const root = document.getElementById("root");
let rows = [], assigns = {}, lib = {}, pres = {}, err = "", loading = false, backendOld = false;
let role = "admin";   // admin＝她（全功能）；reviewer＝审核同事（只看达人和成片、发补拍）。后台 whoami 定
const canEdit = () => role === "admin";
let quotas = { limits: {}, used: {}, def: 5 }, noteRows = [], editRows = [], reshootRows = [];
const ui = { prod: "all", q: "", open: null, brand: "all", notesOpen: {} };
// 读也走 POST，钥匙进 body 不挂在网址上；后台还是 v6 时 POST 读动作会回 unknown action，退回 GET 一次
async function post(body) { const r = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ key }, body)) }); return r.json(); }
async function api(params) {
  const r = await post(params);
  if (r && r.error === "unknown action") { const u = API + "?" + new URLSearchParams(Object.assign({ key }, params)); return (await fetch(u)).json(); }
  return r;
}
const setPres = pr => { pres = {}; (pr?.rows || []).forEach(x => pres[String(x.who).toLowerCase()] = x); };
let busy = false;
// quiet=true：定时刷新，不显示读取中、不先清页面，拉完数据再画
async function load(quiet) {
  if (busy) return; busy = true;
  if (!quiet) { loading = true; err = ""; render(); }
  try {
    try { const me = await api({ action: "whoami" }); role = (me?.ok && me.role) || "admin"; } catch (e) { role = "admin"; }   // 旧后台没这个接口（回的是 hello）：按 admin
    if (role === "none") throw new Error("钥匙不对");
    const [l, a, idx, bl, pr, qt, nt, ed] = await Promise.all([api({ action: "list", n: 300 }), api({ action: "assignments" }),
      fetch("scripts/index.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({ scripts: [] })), api({ action: "scripts" }).catch(() => ({})), api({ action: "presence" }).catch(() => ({})),
      api({ action: "quotas" }).catch(() => ({})), api({ action: "notes" }).catch(() => ({})), api({ action: "alledits" }).catch(() => ({}))]);
    const rsr = await api({ action: "reshoots" }).catch(() => ({})); if (rsr?.ok) reshootRows = rsr.rows || [];
    setPres(pr);
    if (!l.ok) throw new Error(l.error === "no key" ? "钥匙不对" : l.error);
    rows = l.rows; assigns = {}; (a.rows || []).forEach(r => assigns[r.who] = r);
    lib = {}; (idx.scripts || []).forEach(s => lib[s.id] = Object.assign({ owner: "", where: "site" }, s));
    backendOld = !bl || !bl.ok;                       // 后台还没发新版本：没有脚本库接口
    (bl?.scripts || []).forEach(s => lib[s.id] = Object.assign({ where: "backend" }, s));
    if (qt?.ok) quotas = { limits: qt.limits || {}, used: qt.used || {}, def: Number(qt.def) || 5 };
    if (nt?.ok) noteRows = (nt.rows || []).slice().sort((x, y) => (new Date(y.time) - new Date(x.time)));
    if (ed?.ok) editRows = ed.rows || [];
    if (quiet) err = "";
  } catch (e) { err = String(e?.message || e); }
  loading = false; busy = false;
  quiet ? softRender() : render();
}
async function refreshPresence() {
  try { const pr = await api({ action: "presence" }); if (pr?.ok) { setPres(pr); softRender(); } } catch (e) {}
}
// 定时刷新用：她正在输入或开着弹窗时先不重画，等下一轮
let dirty = false;
function softRender() {
  const ae = document.activeElement;
  const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if ($(".modal") || typing) { dirty = true; return; }
  render();
}
let tPres = 0, tFull = 0;
function startTimers() {
  clearInterval(tPres); clearInterval(tFull);
  tPres = setInterval(() => { if (!document.hidden && key) { if (dirty) softRender(); refreshPresence(); } }, 20000);
  tFull = setInterval(() => { if (!document.hidden && key) load(true); }, 60000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && key) { refreshPresence(); load(true); } });
const onlineCount = () => Object.values(pres).filter(x => (Date.now() - new Date(x.last).getTime()) < 3 * 60000).length;
const limitOf = who => { const k = Object.keys(quotas.limits || {}).find(x => same(x, who)); return k ? Number(quotas.limits[k]) : quotas.def; };
const usedOf = who => { const k = Object.keys(quotas.used || {}).find(x => same(x, who)); return k ? Number(quotas.used[k]) || 0 : 0; };
const fmtT = t => { const d = new Date(t); return isNaN(d) ? "" : `${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const mb = n => (Number(n) / 1048576).toFixed(1) + " MB";
const fileId = url => (String(url).match(/\/d\/([A-Za-z0-9_-]+)/) || [])[1] || "";
const L = (o, k = uiLang) => (o && typeof o === "object") ? (o[k] || o.zh || o.id || "") : (o || "");   // 脚本内容字段跟界面语言走
const scriptIds = s => String(s || "").split(/[,\s，、]+/).filter(Boolean);
// 产品归类：每本的产品写法不一（"鎏金蛋白膜 Golden Mask" / "VEIRFOO Golden Mask 鎏金蛋白膜"），取第一段中文当家族名
const famKey = s => { const zh = String(L(s.product, "zh") || "").replace(/（[^）]*）|\([^)]*\)/g, ""); const m = zh.match(/[\u4e00-\u9fff]+/); let k = m ? m[0] : zh.trim(); k = k.replace(/^小/, ""); return k || "其他"; };
const talentNames = () => { const set = new Map(); rows.forEach(r => set.set(r.who.toLowerCase(), r.who)); Object.values(assigns).forEach(a => set.set(a.who.toLowerCase(), a.who)); return [...set.values()].sort((a, b) => a.localeCompare(b)); };
async function fullScript(id) {
  const s = lib[id]; if (!s) return null;
  if (s.full) return s.full;
  try { s.full = s.where === "backend" ? (await api({ action: "script", id })).script : await fetch(`scripts/${encodeURIComponent(id)}.json`, { cache: "no-cache" }).then(r => r.json()); } catch (e) { s.full = null; }
  return s.full;
}

// ===== 印尼语界面（审核同事是印尼人，11-05 她定）=====
// 渲染照旧出中文；开 ID 时在 DOM 上按词典替换文本节点和 placeholder/title，弹窗、动态数字、后来插进来的节点都由 MutationObserver 接住。
// 脚本内容（产品/钩子/分镜）走 L()：界面 ID 就取 .id 字段。加文案：整句放 ID_MAP，带变量的写进 ID_RULES（顺序有先后，长的在前）。
let uiLang = store.get("review_lang", "zh");
const langBtn = () => `<button class="ghost sm" id="langbtn" style="margin-left:6px">${uiLang === "id" ? "中文" : "ID"}</button>`;
function bindLang() { const b = $("#langbtn"); if (b) b.onclick = () => { uiLang = uiLang === "id" ? "zh" : "id"; store.set("review_lang", uiLang); document.title = uiLang === "id" ? "Rekaman Kreator · Review" : "达人自录 审片"; render(); }; }
const ID_RULES = [
  [/(\d+) 条上传 · (\d+) 个达人 · 在线 (\d+) 人(?: · 脚本库 (\d+) 本)?/, (m, a, b, c, d) => `${a} upload · ${b} kreator · ${c} online${d ? ` · ${d} naskah` : ""}`],
  [/缺第 ([\d、]+) 段/g, "Kurang bagian $1"],

  if (node.nodeType === 3) { if (hasZh(node.nodeValue)) put(node); return; }

const byTime = (x, y) => (y.time > x.time ? 1 : -1);
// shots：{ "1": [行…], "2": [...], "成片": [...] }；成片单独放前面，缺段只按数字段算
function scriptBlock(sid, shots, who) {
  const total = lib[sid]?.shots || 0;
  const finals = (shots["成片"] || []).slice().sort(byTime);
  const keys = Object.keys(shots).filter(k => k !== "成片").sort((a, b) => (/^\d+$/.test(a) ? Number(a) : 1e9) - (/^\d+$/.test(b) ? Number(b) : 1e9));
  const miss = []; for (let i = 1; i <= total; i++) if (!shots[i]) miss.push(i);
  const status = finals.length ? "" : total ? (miss.length ? `<span class="miss">缺第 ${miss.join("、")} 段</span>` : `<span class="full">${total} 段齐了</span>`) : `<span class="tip">脚本库里没有这本</span>`;   // 有成片就不报缺段
  const rsList = reshootRows.filter(r => same(r.who, who) && same(r.script, sid));
  const rsOf = n => rsList.find(r => String(r.shot) === String(n));
  // 成片分段条：按成片上传时带的各段时长算起止秒，她对着 Drive 播放器的时间就知道是第几段；没带时长（旧成片）就只列段号
  const pin = arr => (Array.isArray(arr) ? arr : []).map(x => ({ n: Number(x?.n) || 0, sec: Number(x?.sec) || 0 }));   // 达人传上来的分段只认数字
  let segs = [], approx = false; try { segs = pin(JSON.parse(finals[0]?.segs || "[]")); } catch (e) {}
  if (!segs.length && total && finals.length) {   // 旧成片没带实际时长：按脚本里每段计划秒数算，标 ≈；脚本正文还没拉到就先拉，拉到再画
    const full = lib[sid]?.full;
    if (full?.shots?.length) { segs = pin(full.shots); approx = true; }
    else { if (lib[sid] && !lib[sid].fullLoading) { lib[sid].fullLoading = true; fullScript(sid).then(() => softRender()); } segs = Array.from({ length: total }, (_, k) => ({ n: k + 1 })); }
  }

  const chips = finals.length && segs.length ? `<div class="chips" style="margin:6px 0 2px;align-items:center"><span class="tip">成片分段：</span>${segs.map(sg => { const a = acc, b = sg.sec ? Math.round(acc + sg.sec) : 0; acc += sg.sec || 0; const r = rsOf(sg.n);
      return `<span class="chip ${r ? (r.status === "已补" ? "" : "on") : ""}" style="display:inline-flex;align-items:center;gap:6px;${r?.status === "已补" ? "border-color:var(--ok);color:var(--ok)" : r ? "background:var(--red);border-color:var(--red)" : ""}">第 ${sg.n} 段${sg.sec ? ` ${approx ? "≈" : ""}${Math.round(a)}–${b}s` : ""}${r ? (r.status === "已补" ? " · 已补 ✓" : ` · 要补拍${r.note ? "：" + esc(String(r.note).slice(0, 30)) : ""}`) : ""}${r && r.status !== "已补" ? `<button data-unreshoot="${esc(who)}" data-sid="${esc(sid)}" data-n="${sg.n}" title="撤销" style="min-height:0;padding:0 4px;background:none;border:0;color:inherit;font-size:13px">✕</button>` : r ? `<button data-unreshoot="${esc(who)}" data-sid="${esc(sid)}" data-n="${sg.n}" title="清掉这条记录" style="min-height:0;padding:0 4px;background:none;border:0;color:inherit;font-size:13px">✕</button>` : `<button data-reshoot="${esc(who)}" data-sid="${esc(sid)}" data-n="${sg.n}" style="min-height:0;padding:0 4px;background:none;border:0;color:var(--red);font-size:12px;font-weight:600">要补拍</button>`}</span>`; }).join("")}</div>` : "";
  return `<div class="script"><div class="h"><b>${esc(sid)}</b><span>${esc(L(lib[sid]?.product) || "")}</span>${status}${finals.length ? `<span class="full">✓ 有成片</span>` : ""}${rsList.some(r => r.status !== "已补") ? `<span class="miss">等补拍：第 ${rsList.filter(r => r.status !== "已补").map(r => r.shot).join("、")} 段</span>` : ""}</div>
    ${finals.length ? `<div class="finals">${finals.map(f => shotCard("成片", [f], "", "final")).join("")}</div>${chips}` : ""}
    <div class="grid">${keys.map(k => { const list = shots[k].slice().sort(byTime); const ed = editFor(who, sid, k);
      return shotCard(/^\d+$/.test(k) ? `第 ${k} 段` : (k || "未标段"), list, ed && String(ed.lines || "").trim() ? `<span class="ed">她改了台词：${esc(ed.lines)}</span>` : ""); }).join("")}</div></div>`;
}

    $("#pok", m).disabled = true; $("#pok", m).textContent = "保存中…";
    const r = await post({ action: "putscript", script: draft, owner, source: "review" });
    if (!r.ok) { $("#pok", m).disabled = false; $("#pok", m).textContent = "保存到脚本库"; alert("没存上：" + (r.error === "unknown action" ? "后台还是旧版，先去 Apps Script 发新版本" : r.error)); return; }
    m.remove(); await load();
    if (owner && r.id && !currentIds(owner).some(x => same(x, r.id))) saveAssign(owner, currentIds(owner).concat([r.id]));   // 专属本子存完直接派给她
  };
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
function editHtml(d) {
  const zi = (path, o, ph) => `<div class="cell"><small>${esc(ph)} 中</small><textarea data-f="${path}.zh">${esc(o?.zh || "")}</textarea></div><div class="cell"><small>${esc(ph)} ID</small><textarea data-f="${path}.id">${esc(o?.id || "")}</textarea></div>`;
  return `<div class="edit" style="grid-template-columns:1fr 1fr"><div class="cell"><small>产品 中</small><input data-f="product.zh" value="${esc(d.product?.zh || "")}"></div><div class="cell"><small>Produk ID</small><input data-f="product.id" value="${esc(d.product?.id || "")}"></div>
      <div class="cell"><small>钩子 中</small><input data-f="hook.zh" value="${esc(d.hook?.zh || "")}"></div><div class="cell"><small>Hook ID</small><input data-f="hook.id" value="${esc(d.hook?.id || "")}"></div>
      ${zi("prep", d.prep, "开拍前准备")}</div>
    <div class="lab" style="margin-top:10px">分镜 ${d.shots.length} 段 · 合计 ${d.shots.reduce((a, s) => a + (+s.sec || 0), 0)} 秒</div>
    ${d.shots.map((s, i) => `<div class="edit"><b>${esc(s.n)}</b><div class="cell"><small>秒</small><input type="number" min="2" data-f="shots.${i}.sec" value="${+s.sec || 0}"></div>
      ${zi(`shots.${i}.face`, s.face, "脸上")}
      <span></span><span></span>${zi(`shots.${i}.do`, s.do, "推荐拍法")}
      <span></span><span></span><div class="cell lines"><small>台词（印尼语，空＝不说话）</small><textarea data-f="shots.${i}.lines">${esc(s.lines || "")}</textarea></div>
      <span></span><span class="bar" style="grid-column:2 / span 3"><button class="ghost sm" data-addshot="${i}">在后面加一段</button><button class="ghost sm" data-delshot="${i}">删这段</button></span></div>`).join("")}`;
}

// ----- 播放 / 删 -----
function play(id, name) {
  const ov = document.createElement("div"); ov.className = "player";
  ov.innerHTML = `<div class="pt">${esc(name)}</div><iframe src="https://drive.google.com/file/d/${esc(id)}/preview" allow="autoplay"></iframe>
    <div class="bar"><a href="https://drive.google.com/file/d/${esc(id)}/view" target="_blank" rel="noopener">在 Drive 打开</a><button id="close">关闭</button></div>`;
  document.body.appendChild(ov);
  $("#close", ov).onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
}
async function del(what) {
  const keep = rows;
  rows = rows.filter(r => !(what.ids ? what.ids.includes(fileId(r.url)) : same(r.who, what.who))); err = ""; render();
  const r = await post(Object.assign({ action: "del" }, what));
  if (!r.ok) { rows = keep; err = r.error === "no key" ? "钥匙不对" : r.error; render(); }
}
// 删达人：本地先把她从所有列表里抹掉，再叫后台 deltalent；后台还是旧版（没这个接口）就退回只删上传＋收回派单
async function delTalent(who) {
  const snap = { rows, assigns, pres, noteRows, editRows, quotas: JSON.parse(JSON.stringify(quotas)), lib };
  rows = rows.filter(r => !same(r.who, who));
  assigns = Object.fromEntries(Object.entries(assigns).filter(([k]) => !same(k, who)));
  pres = Object.fromEntries(Object.entries(pres).filter(([k]) => !same(k, who)));
  noteRows = noteRows.filter(n => !same(n.who, who)); editRows = editRows.filter(e => !same(e.who, who)); reshootRows = reshootRows.filter(r => !same(r.who, who));
  Object.keys(quotas.limits).forEach(k => { if (same(k, who)) delete quotas.limits[k]; }); Object.keys(quotas.used).forEach(k => { if (same(k, who)) delete quotas.used[k]; });
  lib = Object.fromEntries(Object.entries(lib).filter(([, s]) => !(s.owner && same(s.owner, who))));
  err = ""; render();
  const r = await post({ action: "deltalent", who });
  if (r.ok) return;
  if (r.error === "unknown action") {   // 旧后台
    await post({ action: "del", who }); await post({ action: "assign", who, scripts: "" });
    err = "后台还是旧版：只删了上传和派单，登录记录还在、刷新后这个人还会出现；Apps Script 发新版本后再删一次就干净了。"; render(); return;
  }
  rows = snap.rows; assigns = snap.assigns; pres = snap.pres; noteRows = snap.noteRows; editRows = snap.editRows; quotas = snap.quotas; lib = snap.lib;
  err = r.error === "no key" ? "钥匙不对" : String(r.error || "删除失败"); render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { const ms = $$(".modal"); if (ms.length) ms[ms.length - 1].remove(); } });
render();
if (key) load();
startTimers();
